[project]
name = "babynames-api"
version = "0.1.0"
description = "Baby Name Swipe backend service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary,pool]>=3.2.0",
    "alembic>=1.14.0",
    "pyjwt>=2.10.0",
    "cryptography>=44.0.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "testcontainers[postgres]>=4.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "DTZ", "T10", "PIE", "RET", "SIM"]
ignore = [
    "B008",  # FastAPI requires Depends() in function defaults
    "N815",  # API schemas use camelCase to match frontend contract
]

[tool.pyright]
include = ["src"]
strict = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
